name: Separate WhatsApp Cloud API checks
on:
  push:
    paths:
      - 'whatsapp-cloud-api/**'
      - '.github/workflows/whatsapp-cloud-api-checks.yml'
  pull_request:
    paths:
      - 'whatsapp-cloud-api/**'
      - '.github/workflows/whatsapp-cloud-api-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-cloud-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build.mjs
      - run: node --test transport.test.mjs worker.test.mjs funnel.test.mjs
      - run: git diff --exit-code -- funnel.mjs qr-data.mjs
