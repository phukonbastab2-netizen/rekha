import groovy.json.JsonSlurper
plugins { id 'com.android.application' version '8.9.1' }
def catalog = new JsonSlurper().parse(file('../dist/catalog.json'))
android {
    namespace 'in.rekha.global'
    compileSdk 36
    defaultConfig {
        applicationId 'in.rekha.global'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.3.2-connected'
        buildConfigField 'boolean', 'IS_OWNER', 'false'
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
    buildFeatures { buildConfig true }
    flavorDimensions += 'country'
    productFlavors {
        owner {
            dimension 'country'
            applicationId 'in.rekha.global.owner'
            resValue 'string', 'app_name', 'Rekha Global Admin'
            buildConfigField 'boolean', 'IS_OWNER', 'true'
            buildConfigField 'String', 'LIVE_URL', '"https://rekhaastrology.in/global-apps/preview/control.html"'
        }
        catalog.each { country ->
            create(country.id.replace('-','')) {
                dimension 'country'
                applicationId "in.rekha.global.${country.id.replace('-','')}"
                resValue 'string', 'app_name', "${country.name}"
                buildConfigField 'String', 'LIVE_URL', '"https://rekha-'+country.id+'.phukonbastab2.workers.dev/"'
            }
        }
    }
    catalog.each { country ->
        sourceSets.getByName(country.id.replace('-','')).assets.srcDirs = ["../dist/web/${country.id}"]
        sourceSets.getByName(country.id.replace('-','')).res.srcDirs = ["flavors/${country.id}/res"]
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
