<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Rekha Inbox · Sign in</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#163a31;font:16px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{background:#fff;width:min(100%,390px);padding:32px 26px;border-radius:24px;box-shadow:0 15px 60px #123c2810}.mark{width:64px;height:64px;border-radius:20px;background:#008069;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700}h1{font-size:26px;margin-bottom:6px}p{color:#637870;line-height:1.5;margin-top:0}label{display:block;font-weight:600;font-size:14px;margin:22px 0 8px}input{width:100%;padding:14px;border:1px solid #ccd9d3;border-radius:12px;font-size:18px;outline-color:#008069}button,a{display:block;text-align:center;width:100%;padding:14px;border-radius:12px;font:600 16px system-ui;border:0;text-decoration:none}button{color:#fff;background:#008069;margin:14px 0;cursor:pointer}a{color:#00755f;background:#e8f4ee}small{display:block;text-align:center;color:#76877e;margin-top:20px}#error{min-height:24px;color:#a13232;font-size:14px;margin:4px 0}button:disabled{opacity:.6}</style></head><body><main><div class="mark">R</div><h1>Rekha Inbox</h1><p>Your private WhatsApp workspace.</p><form id="login"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus maxlength="256"><button id="submit">Sign in</button><div id="error" role="alert"></div></form><a href="__BASE__/downloads/RekhaInbox.apk" download>Download Android app</a><small>Private access · Rekha Astrology</small></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('__BASE__/auth/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok){error.textContent=r.status===429?'Too many attempts. Please try again in 15 minutes.':'Incorrect password. Please try again.';return;}location.replace('__BASE__/');}catch{error.textContent='Connection unavailable. Please try again.';}finally{button.disabled=false;}};
</script></body></html>
