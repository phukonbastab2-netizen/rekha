<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekha · Private Inbox</title>
<style>
:root{font:15px system-ui,sans-serif;color:#20332e;background:#e5ede9}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:#087e62;color:white;font-weight:650}button:disabled{opacity:.5;cursor:default}header{height:76px;background:#075e54;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}h1{font-size:21px;margin:0 0 3px}header small{opacity:.85}.shell{max-width:1500px;margin:auto;display:grid;grid-template-columns:340px 1fr;height:calc(100dvh - 76px)}aside{background:#fff;border-right:1px solid #d4dfd9;overflow:auto}.search{padding:16px;position:sticky;top:0;background:#fff}.search input{width:100%;border:0;background:#f0f4f2;border-radius:10px;padding:12px}.chat{display:block;width:100%;text-align:left;background:#fff;color:#213d32;border-radius:0;padding:17px 18px;border-bottom:1px solid #f0f2f1;font-weight:400}.chat.selected{background:#e0f1e9}.chat strong{display:block;font-size:16px;margin-bottom:5px}.chat small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#64786e}.conversation{min-height:0;display:flex;flex-direction:column;min-width:0;background-color:#e9e4d9;background-image:radial-gradient(#748c7820 1px,transparent 1px);background-size:22px 22px}.top{flex-shrink:0;min-height:74px;padding:14px 24px;background:#f5f8f5;border-bottom:1px solid #d6e2d8;display:flex;align-items:center;gap:12px}.top strong{display:block}.top small{color:#667c70}.back{display:none}#messages{min-height:0;flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:9px}.bubble{align-self:flex-start;max-width:min(78%,660px);padding:10px 14px 7px;border-radius:10px;background:white;box-shadow:0 1px 2px #213d3218}.bubble.out{align-self:flex-end;background:#d9f7c9}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.bubble footer{font-size:11px;color:#70816c;text-align:right;margin-top:5px}.bubble img,.bubble video{max-width:100%;max-height:360px;border-radius:8px}.bubble audio{max-width:100%}.compose{flex-shrink:0;padding:14px 20px;background:#f5f8f5;display:flex;gap:12px;align-items:flex-end}textarea{resize:none;min-height:48px;max-height:160px;width:100%;border:1px solid #d4dfd5;border-radius:12px;padding:12px;background:#fff;outline-color:#16856c}#notice{flex-shrink:0;padding:8px 20px;background:#fff6d6;color:#635220;font-size:13px;min-height:33px}#empty{margin:auto;text-align:center;color:#657b6c;max-width:360px;line-height:1.7}#empty strong{font-size:22px;display:block;color:#204b3a}#older{align-self:center;background:#fff;color:#416450;padding:7px 15px;font-size:13px}#refresh{background:#ffffff24;font-size:13px}#status{font-size:12px;margin-left:12px}.hide{display:none!important}@media(max-width:720px){header{padding:12px 16px;height:72px}h1{font-size:18px}.shell{height:calc(100dvh - 72px);display:block}aside{height:100%;border:0}.conversation{display:none;height:100%}.shell.open aside{display:none}.shell.open .conversation{display:flex}.back{display:block;padding:7px 12px}.top{padding:10px 14px}.bubble{max-width:90%}#messages{padding:15px}.compose{flex-shrink:0;padding:10px}#status{display:none}}
</style>
<header><div><h1>Rekha · Private Inbox</h1><small>Manual replies · Oracle</small></div><div><span id="status">Connecting…</span><button id="refresh">Refresh</button></div></header>
<main class="shell" id="shell"><aside><div class="search"><input id="search" placeholder="Search phone number" aria-label="Search customers"></div><div id="chats"></div></aside><section class="conversation"><div class="top"><button class="back" id="back" aria-label="Back to customers">‹</button><div><strong id="name">Choose a customer</strong><small id="progress">Cloudflare funnel continues unchanged</small></div></div><div id="messages"><div id="empty"><strong>Your conversations, together</strong>Select a customer to read the funnel messages and send a personal reply.</div></div><div id="notice">The automatic funnel stays on Cloudflare. Your replies are stored on Oracle.</div><form class="compose" id="form"><textarea id="text" placeholder="Type your reply…" aria-label="Your reply" maxlength="4096" disabled></textarea><button id="send" disabled>Send</button></form></section></main>
<script>
const $=id=>document.getElementById(id);let selected=null,chats=[],busy=false,requestId=null,pendingText=null,olderThan=null,lastDigest='',connectionError=false;
async function api(path,options){const response=await fetch(path,{credentials:'same-origin',...options});const value=await response.json();if(!response.ok)throw Error(value.error||'Connection unavailable');return value;}
const post=(path,value)=>api(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(value)});
function notice(text){$('notice').textContent=text;}
function renderChats(){const fragment=document.createDocumentFragment();for(const chat of chats){const button=document.createElement('button');button.className='chat'+(chat.id===selected?' selected':'');const title=document.createElement('strong');title.textContent=chat.number;const preview=document.createElement('small');preview.textContent=chat.preview;button.append(title,preview);button.onclick=()=>choose(chat);fragment.append(button);}$('chats').replaceChildren(fragment);}
function bubble(message){const div=document.createElement('article');div.className='bubble '+message.direction;const p=message.payload;
 if(p.url&&p.url.startsWith('https://')){let media;if(p.type==='image')media=document.createElement('img');if(p.type==='video'){media=document.createElement('video');media.controls=true;media.preload='none';}if(p.type==='audio'){media=document.createElement('audio');media.controls=true;media.preload='none';}if(media){media.src=p.url;media.alt=p.type;div.append(media);}}
 const body=document.createElement('div');body.className='body';body.textContent=p.text||(!p.url?'['+p.type+']':'');div.append(body);const footer=document.createElement('footer');const label=p.source==='you'?'You · accepted by WhatsApp':p.source==='funnel'?'Funnel · '+(p.delivery||'accepted'):'Customer';footer.textContent=label+' · '+new Date(message.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});div.append(footer);return div;}
async function messages(force=false){if(!selected)return;const id=selected;const {messages}=await api('/api/messages?id='+id);if(selected!==id)return;const digest=JSON.stringify(messages);if(!force&&digest===lastDigest)return;lastDigest=digest;const nearBottom=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<120;const fragment=document.createDocumentFragment();if(messages.length===200){const more=document.createElement('button');more.id='older';more.textContent='Load earlier messages';more.onclick=loadOlder;fragment.append(more);}messages.forEach(m=>fragment.append(bubble(m)));$('messages').replaceChildren(fragment);olderThan=messages[0]?.at;if(force||nearBottom)$('messages').scrollTop=$('messages').scrollHeight;}
async function loadOlder(){if(!selected||!olderThan)return;const data=await api('/api/messages?'+new URLSearchParams({id:selected,before:olderThan}));$('older')?.remove();const fragment=document.createDocumentFragment();data.messages.forEach(m=>fragment.append(bubble(m)));$('messages').prepend(fragment);olderThan=data.messages[0]?.at;}
async function choose(chat){selected=chat.id;lastDigest='';$('shell').classList.add('open');$('name').textContent=chat.number;$('progress').textContent=chat.firstReplies+'/5 first replies · '+chat.pending+' automatic messages pending';$('text').disabled=chat.optedOut;$('send').disabled=chat.optedOut;renderChats();await messages(true);}
async function refresh(){try{const [list,status]=await Promise.all([api('/api/chats?q='+encodeURIComponent($('search').value)),api('/api/status')]);chats=list.chats;renderChats();if(selected){const current=chats.find(c=>c.id===selected);if(current){$('progress').textContent=current.firstReplies+'/5 first replies · '+current.pending+' automatic messages pending';}}$('status').textContent=status.error?'Sync unavailable':status.accountPaused?'Sending paused':status.lastSyncAt?'Synced '+new Date(status.lastSyncAt).toLocaleTimeString():'Syncing…';await messages();if(connectionError){connectionError=false;notice('Connection restored. Your reply has not been retried.');}}catch(error){connectionError=true;notice(error.message);}}
$('refresh').onclick=async()=>{try{$('refresh').disabled=true;await post('/api/sync',{});await refresh();notice('Conversations refreshed. Automatic funnel unchanged.');}catch(error){notice(error.message);}finally{$('refresh').disabled=false;}};
$('search').oninput=refresh;$('back').onclick=()=>$('shell').classList.remove('open');
$('form').onsubmit=async event=>{event.preventDefault();if(busy||!selected||!$('text').value.trim())return;const text=$('text').value;if(text!==pendingText){requestId=crypto.randomUUID();pendingText=text;}busy=true;$('send').disabled=true;
 try{const result=await post('/api/send',{id:selected,text,requestId});if(result.state==='accepted'){$('text').value='';requestId=null;pendingText=null;notice('Reply accepted by WhatsApp. Delivery may take a moment.');await messages(true);}else if(result.state==='uncertain')notice('WhatsApp has not confirmed this reply. Do not resend it; check the phone first.');else notice('Reply was not accepted. Check the account before trying another message.');}catch(error){notice(error.message);}finally{busy=false;$('send').disabled=false;}};
refresh();setInterval(refresh,5000);
</script></html>
