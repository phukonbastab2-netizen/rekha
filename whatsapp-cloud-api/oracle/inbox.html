#e0f0df;border-radius:10px;font-size:11px}.shell-main{position:relative;display:flex;min-height:0;flex-direction:column}.sidebar .avatar{width:46px;height:46px}.window-note{margin-bottom:10px}.recording button{padding:8px 12px;background:#fff;border-radius:7px}.attachment .state{font-size:10px;color:var(--green)}
